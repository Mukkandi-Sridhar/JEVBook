[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jevkit"
version = "1.0.0"
description = "Companion toolkit for 'Decide, Don't Generate': a synthetic Jev mock, a SOC alert generator, calibration and decision-policy tools."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "typesafe-sdk==0.7.2",
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "autograd>=1.7",
]

[project.optional-dependencies]
figs = ["matplotlib>=3.8", "segno>=1.6"]
dev = ["pytest>=8", "jupytext>=1.16", "nbclient>=0.10", "nbformat>=5.9", "ipykernel>=6"]

[tool.setuptools.packages.find]
include = ["jevkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

project:
  type: book
  output-dir: _book
  resources:
    - site/

book:
  title: "Decide, Don't Generate"
  subtitle: "Jev, System One Models, and the Decision Layer of Agentic AI"
  author: "Sridhar Mukkandi"
  date: "2026"
  date-format: "YYYY"
  site-url: https://mukkandi-sridhar.github.io/JEVBook
  repo-url: https://github.com/Mukkandi-Sridhar/JEVBook
  downloads: [pdf, epub]
  chapters:
    - index.qmd
    - front/acknowledgements.qmd
    - front/how-to-read.qmd
    - front/prologue.qmd
    - part: parts/p1.qmd
      chapters:
        - chapters/ch01.qmd
        - chapters/ch02.qmd
        - chapters/ch03.qmd
        - chapters/ch04.qmd
    - part: parts/p2.qmd
      chapters:
        - chapters/ch05.qmd
        - chapters/ch06.qmd
        - chapters/ch07.qmd
    - part: parts/p3.qmd
      chapters:
        - chapters/ch08.qmd
        - chapters/ch09.qmd
        - chapters/ch10.qmd
        - chapters/ch11.qmd
        - chapters/ch12.qmd
    - part: parts/p4.qmd
      chapters:
        - chapters/ch13.qmd
        - chapters/ch14.qmd
        - chapters/ch15.qmd
    - part: parts/p5.qmd
      chapters:
        - chapters/ch16.qmd
        - chapters/ch17.qmd
        - chapters/ch18.qmd
        - chapters/ch19.qmd
        - chapters/ch20.qmd
        - chapters/ch21.qmd
    - part: parts/p6.qmd
      chapters:
        - chapters/ch22.qmd
  appendices:
    - back/glossary.qmd
    - back/cheatsheets.qmd
    - back/bibliography.qmd
    - back/index-terms.qmd
    - back/about-author.qmd

bibliography: references.bib
csl: assets/chicago-author-date.csl
link-citations: true
lang: en-GB

filters:
  - filters/book.lua

crossref:
  fig-title: "Figure"
  tbl-title: "Table"
  fig-prefix: "Figure"
  tbl-prefix: "Table"

execute:
  echo: true
  freeze: auto
  warning: false

format:
  pdf:
    pdf-engine: lualatex
    documentclass: scrbook
    classoption: [twoside, open=any, fontsize=10.5pt, headings=standardclasses, numbers=noenddot]
    papersize: custom
    geometry:                      # 7 x 10 in trim; equal margins so the text sits in the same place on every page
      - paperwidth=7in
      - paperheight=10in
      - top=0.8in
      - bottom=0.85in
      - inner=0.9in
      - outer=0.9in
      - marginparsep=0.1in
      - marginparwidth=0.6in
      - headsep=0.28in
      - footskip=0.42in
    toc: true
    toc-depth: 1
    number-sections: true
    fig-pos: "htbp"
    fig-cap-location: bottom
    tbl-cap-location: top
    code-block-bg: false
    code-block-border-left: false
    highlight-style: assets/book.theme
    colorlinks: false
    include-in-header: assets/latex/preamble.tex
    template-partials:
      - assets/latex/before-body.tex
      - assets/latex/doc-class.tex
    keep-tex: true
    latex-makeindex-opts: ["-s", "assets/latex/book.ist"]
    cite-method: citeproc
  html:
    theme: [cosmo, assets/web/book.scss]
    css: assets/web/book.css
    toc: true
    number-sections: true
    code-copy: true
    fig-responsive: true
    include-in-header: assets/web/head.html
  epub:
    css: assets/web/epub.css
    toc: true
    number-sections: true
    epub-cover-image: cover/ebook/cover.jpg

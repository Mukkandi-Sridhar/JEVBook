project:
  type: book
  output-dir: _book
  resources:
    - site/

book:
  title: "Decide, Don't Generate"
  subtitle: "Jev, System One Models, and the Decision Layer of Agentic AI"
  author: "Sridhar Mukkandi"
  date: "2026"
  date-format: "YYYY"
  site-url: https://mukkandi-sridhar.github.io/decide-dont-generate
  repo-url: https://github.com/Mukkandi-Sridhar/decide-dont-generate
  downloads: [pdf, epub]
  chapters:
    - index.qmd
    - front/how-to-read.qmd
    - front/prologue.qmd
    - chapters/c01.qmd
    - chapters/c02.qmd
    - chapters/c03.qmd
    - chapters/c04.qmd
    - chapters/c05.qmd
    - chapters/c06.qmd
    - chapters/c07.qmd
    - chapters/c08.qmd
    - chapters/c09.qmd
    - chapters/c10.qmd
    - chapters/c11.qmd
    - chapters/c12.qmd
    - chapters/c13.qmd
    - chapters/c14.qmd
    - chapters/c15.qmd
  appendices:
    - back/glossary.qmd
    - back/cheatsheets.qmd
    - back/answers.qmd
    - back/bibliography.qmd
    - back/index-terms.qmd
    - back/about-author.qmd

bibliography: references.bib
csl: assets/chicago-author-date.csl
link-citations: true
lang: en-GB

filters:
  - filters/book.lua

crossref:
  fig-title: "Figure"
  tbl-title: "Table"
  fig-prefix: "Figure"
  tbl-prefix: "Table"

execute:
  echo: true
  freeze: auto
  warning: false

format:
  pdf:
    pdf-engine: lualatex
    documentclass: scrbook
    classoption: [twoside, open=any, fontsize=10.5pt, headings=standardclasses, numbers=noenddot]
    papersize: custom
    geometry:                      # 7 x 10 in trim; equal margins so the text sits in the same place on every page
      - paperwidth=7in
      - paperheight=10in
      - top=0.8in
      - bottom=0.85in
      - inner=0.9in
      - outer=0.9in
      - marginparsep=0.1in
      - marginparwidth=0.6in
      - headsep=0.28in
      - footskip=0.42in
    toc: true
    toc-depth: 1
    number-sections: true
    fig-pos: "htbp"
    fig-cap-location: bottom
    tbl-cap-location: top
    code-block-bg: false
    code-block-border-left: false
    highlight-style: assets/book.theme
    colorlinks: false
    include-in-header: assets/latex/preamble.tex
    template-partials:
      - assets/latex/before-body.tex
      - assets/latex/doc-class.tex
    keep-tex: true
    latex-makeindex-opts: ["-s", "assets/latex/book.ist"]
    cite-method: citeproc
  html:
    theme: [cosmo, assets/web/book.scss]
    css: assets/web/book.css
    toc: true
    number-sections: true
    code-copy: true
    fig-responsive: true
    include-in-header: assets/web/head.html
  epub:
    css: assets/web/epub.css
    toc: true
    number-sections: true
    epub-cover-image: cover/ebook/cover.jpg

   <g id="text_1">
    <text style="font-weight: 700; font-size: 7px; font-family: 'Inter'; text-anchor: middle; fill: #1f2430" x="55.08" y="24.86625" transform="rotate(-0 55.08 24.86625)">VERIFIED</text>
   </g>
   <g id="text_2">
    <text style="font-style: italic; font-size: 5.6px; font-family: 'Inter'; text-anchor: middle; fill: #4b5563" x="54.72" y="47.69682" transform="rotate(-0 54.72 47.69682)">read in the public SDK</text>
   </g>
   <g id="text_3">
    <text style="font-size: 6.1px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="6.48" y="77.766433" transform="rotate(-0 6.48 77.766433)">• POST /v1/systemone</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6.1px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="6.48" y="113.746894" transform="rotate(-0 6.48 113.746894)">• state + model + questions</text>
   </g>
   <g id="text_5">
    <text style="font-size: 6.1px; font-family: 'Inter'; fill: #1f2430" transform="translate(6.48 149.734979)">• three types: choice,</text>
    <text style="font-size: 6.1px; font-family: 'Inter'; fill: #1f2430" transform="translate(6.48 159.356657)">score, noul</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.1px; font-family: 'Inter'; fill: #1f2430" transform="translate(6.48 185.766433)">• a probability for every</text>
    <text style="font-size: 6.1px; font-family: 'Inter'; fill: #1f2430" transform="translate(6.48 195.373337)">option; default model</text>
    <text style="font-size: 6.1px; font-family: 'Inter'; fill: #1f2430" transform="translate(6.48 204.936874)">“jev-latest”</text>
   </g>
   <g id="text_7">
    <text style="font-size: 6.1px; font-family: 'Inter'; fill: #1f2430" transform="translate(6.48 221.662065)">• output tokens currently</text>
    <text style="font-size: 6.1px; font-family: 'Inter'; fill: #1f2430" transform="translate(6.48 231.751728)">free (SDK docs)</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 7px; font-family: 'Inter'; text-anchor: middle; fill: #1f2430" x="170.28" y="24.86625" transform="rotate(-0 170.28 24.86625)">VENDOR-REPORTED</text>
   </g>
   <g id="text_9">
    <text style="font-style: italic; font-size: 5.6px; font-family: 'Inter'; fill: #4b5563" transform="translate(133.978063 47.685883)">claimed; not independently</text>
    <text style="font-style: italic; font-size: 5.6px; font-family: 'Inter'; fill: #4b5563" transform="translate(151.972438 56.976961)">checked here</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.1px; font-family: 'Inter'; fill: #1f2430" transform="translate(121.68 77.673979)">• “parallel sampler”: all</text>
    <text style="font-size: 6.1px; font-family: 'Inter'; fill: #1f2430" transform="translate(121.68 87.341884)">outputs in one pass</text>
   </g>
   <g id="text_11">
    <text style="font-size: 6.1px; font-family: 'Inter'; fill: #1f2430" transform="translate(121.68 114.330683)">• trained with RLCD:</text>
    <text style="font-size: 6.1px; font-family: 'Inter'; fill: #1f2430" transform="translate(121.68 123.337595)">reinforcement learning</text>
    <text style="font-size: 6.1px; font-family: 'Inter'; fill: #1f2430" transform="translate(121.68 133.552116)">for calibrated decisions</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6.1px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="121.68" y="149.692089" transform="rotate(-0 121.68 149.692089)">• 70–500 ms latency</text>
   </g>
   <g id="text_13">
    <text style="font-size: 6.1px; font-family: 'Inter'; fill: #1f2430" transform="translate(121.68 185.998995)">• $0.042 per million</text>
    <text style="font-size: 6.1px; font-family: 'Inter'; fill: #1f2430" transform="translate(121.68 195.341884)">input tokens</text>
   </g>
   <g id="text_14">
    <text style="font-size: 6.1px; font-family: 'Inter'; fill: #1f2430" transform="translate(121.68 221.742604)">• two orders of magnitude</text>
    <text style="font-size: 6.1px; font-family: 'Inter'; fill: #1f2430" transform="translate(121.68 231.957126)">faster than LLMs</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 7px; font-family: 'Inter'; text-anchor: middle; fill: #1f2430" x="285.48" y="24.864609" transform="rotate(-0 285.48 24.864609)">UNKNOWN</text>
   </g>
   <g id="text_16">
    <text style="font-style: italic; font-size: 5.6px; font-family: 'Inter'; text-anchor: middle; fill: #4b5563" x="285.12" y="47.69682" transform="rotate(-0 285.12 47.69682)">not published</text>
   </g>
   <g id="text_17">
    <text style="font-size: 6.1px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="236.88" y="77.734979" transform="rotate(-0 236.88 77.734979)">• model size and layers</text>
   </g>
   <g id="text_18">
    <text style="font-size: 6.1px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="236.88" y="113.711151" transform="rotate(-0 236.88 113.711151)">• training data</text>
   </g>
   <g id="text_19">
    <text style="font-size: 6.1px; font-family: 'Inter'; fill: #1f2430" transform="translate(236.88 150.287792)">• how RLCD’s reward</text>
    <text style="font-size: 6.1px; font-family: 'Inter'; fill: #1f2430" transform="translate(236.88 159.959985)">is defined</text>
   </g>
   <g id="text_20">
    <text style="font-size: 6.1px; font-family: 'Inter'; fill: #1f2430" transform="translate(236.88 186.330683)">• calibration on</text>
    <text style="font-size: 6.1px; font-family: 'Inter'; fill: #1f2430" transform="translate(236.88 195.257056)">your data</text>
   </g>
   <g id="text_21">
    <text style="font-size: 6.1px; font-family: 'Inter'; fill: #1f2430" transform="translate(236.88 222.362136)">• failure modes on</text>
    <text style="font-size: 6.1px; font-family: 'Inter'; fill: #1f2430" transform="translate(236.88 231.341884)">adversarial input</text>
   </g>
  </g>
 </g>

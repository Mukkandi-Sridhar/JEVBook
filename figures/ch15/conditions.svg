   <g id="text_1">
    <text style="font-weight: 700; font-size: 6.8px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="3.358" y="14.287437" transform="rotate(-0 3.358 14.287437)">When can fast judgement be trusted? (after Kahneman and Klein, 2009)</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 6.3px; font-family: 'Inter'; text-anchor: middle; fill: #1f2430" x="42.958" y="60.651914" transform="rotate(-0 42.958 60.651914)">A regular world</text>
   </g>
   <g id="text_3">
    <text style="font-size: 5.8px; font-family: 'Inter'; fill: #4b5563" transform="translate(2.88 91.794865)">the same cues keep meaning</text>
    <text style="font-size: 5.8px; font-family: 'Inter'; fill: #4b5563" transform="translate(21.194406 100.917971)">the same things</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 6.3px; font-family: 'Inter'; text-anchor: middle; fill: #1f2430" x="129.358" y="60.81532" transform="rotate(-0 129.358 60.81532)">Lots of practice</text>
   </g>
   <g id="text_5">
    <text style="font-size: 5.8px; font-family: 'Inter'; fill: #4b5563" transform="translate(99.499781 91.748193)">many examples, not a</text>
    <text style="font-size: 5.8px; font-family: 'Inter'; fill: #4b5563" transform="translate(100.245625 101.536939)">handful of anecdotes</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 6.3px; font-family: 'Inter'; text-anchor: middle; fill: #1f2430" x="215.758" y="60.850758" transform="rotate(-0 215.758 60.850758)">Quick, clear feedback</text>
   </g>
   <g id="text_7">
    <text style="font-size: 5.8px; font-family: 'Inter'; fill: #4b5563" transform="translate(187.392375 91.847428)">you find out whether</text>
    <text style="font-size: 5.8px; font-family: 'Inter'; fill: #4b5563" transform="translate(196.089656 100.917971)">you were right</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 6.3px; font-family: 'Inter'; text-anchor: middle; fill: #1f2430" x="302.158" y="61.297664" transform="rotate(-0 302.158 61.297664)">Honest doubt</text>
   </g>
   <g id="text_9">
    <text style="font-size: 5.8px; font-family: 'Inter'; fill: #4b5563" transform="translate(269.770891 91.794865)">knowing when the case</text>
    <text style="font-size: 5.8px; font-family: 'Inter'; fill: #4b5563" transform="translate(285.657453 101.536939)">is unfamiliar</text>

   <g id="text_1">
    <text style="font-weight: 700; font-size: 6.4px; font-family: 'Inter'; text-anchor: start; fill: #3b9c6e" x="2.88" y="14.84" transform="rotate(-0 2.88 14.84)">CHAPTER 6 · ON ONE PAGE</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="2.88" y="34.19375" transform="rotate(-0 2.88 34.19375)">Neurons to networks</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="25.92" y="77.86291" transform="rotate(-0 25.92 77.86291)">A neuron is logistic regression</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(11.52 95.960675)">Weigh the inputs, add them up, squash the total. Part</text>
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(11.52 108.711055)">I already built one.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="245.16" y="77.86291" transform="rotate(-0 245.16 77.86291)">One neuron draws a straight line</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(230.76 95.964448)">It can’t separate “unusual in any direction”. A few</text>
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(230.76 109.487305)">hidden neurons can bend the line.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="25.92" y="192.34291" transform="rotate(-0 25.92 192.34291)">Hinges make any shape</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(11.52 210.440675)">ReLU is a hinge. Add enough hinges, and a network can</text>
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(11.52 223.191055)">draw almost any curve. Without them, layers collapse</text>
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(11.52 236.748413)">into one line.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="245.16" y="192.34291" transform="rotate(-0 245.16 192.34291)">Backpropagation shares the blame</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(230.76 210.454151)">Same gradient descent as Chapter 3. The error flows</text>
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(230.76 223.191055)">backwards, layer by layer, telling each weight which</text>
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(230.76 235.623928)">way to move.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="25.92" y="306.82291" transform="rotate(-0 25.92 306.82291)">Deep = many layers</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(11.52 324.924448)">Each layer builds features from the one before. On</text>
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(11.52 337.705016)">raw pixels and words, that’s what makes deep learning</text>
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(11.52 351.214397)">work.</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="245.16" y="306.82291" transform="rotate(-0 245.16 306.82291)">Bigger isn’t automatically better</text>
   </g>
   <g id="text_14">
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(230.76 324.944932)">On Kestrel’s neat features, logistic regression</text>
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(230.76 337.853797)">scored 0.175; an oversized network 0.511, and it was</text>
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(230.76 351.25267)">overconfident.</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 600; font-size: 7.2px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="2.88" y="551.979141" transform="rotate(-0 2.88 551.979141)">Next: networks need numbers. How does a word become a number that means something?</text>
   </g>

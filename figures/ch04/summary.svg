   <g id="text_1">
    <text style="font-weight: 700; font-size: 6.4px; font-family: 'Inter'; text-anchor: start; fill: #3b9c6e" x="2.88" y="14.84" transform="rotate(-0 2.88 14.84)">CHAPTER 4 · ON ONE PAGE</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="2.88" y="34.19375" transform="rotate(-0 2.88 34.19375)">Calibration: when 0.8 really means 80%</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="25.92" y="77.86291" transform="rotate(-0 25.92 77.86291)">Calibration = honesty</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(11.52 96.002183)">A calibrated model’s 80% happens about 80% of the</text>
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(11.52 108.711055)">time. You check it by grouping and counting.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="245.16" y="77.86291" transform="rotate(-0 245.16 77.86291)">Ranking ≠ honesty</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(230.76 96.154198)">Two models with the same AUC (0.89) can have ECE</text>
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(230.76 109.47329)">0.008 and 0.27.</text>
   </g>
   <g id="text_7">
    <text style="font-size: 5.8px; font-family: 'Inter'; fill: #4b5563" transform="translate(335.16 138.83176)">same ranking,</text>
    <text style="font-size: 5.8px; font-family: 'Inter'; fill: #4b5563" transform="translate(335.16 148.007428)">different honesty</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="25.92" y="195.94291" transform="rotate(-0 25.92 195.94291)">Read the reliability diagram</text>
   </g>
   <g id="text_9">
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(11.52 214.02019)">Said vs happened, bin by bin. On the diagonal is</text>
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(11.52 226.998055)">honest; below it is overconfident. Check the counts.</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="245.16" y="195.94291" transform="rotate(-0 245.16 195.94291)">Rebalancing breaks it</text>
   </g>
   <g id="text_11">
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(230.76 214.29619)">Train on 50/50 data and the model thinks attacks are</text>
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(230.76 226.81154)">common: its average P is 29% when the truth is 8%.</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="25.92" y="314.02291" transform="rotate(-0 25.92 314.02291)">Fix it on held-out data</text>
   </g>
   <g id="text_13">
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(11.52 332.124448)">Platt shifts and stretches; temperature only</text>
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(11.52 345.053797)">stretches; isotonic bends. Fit on data the model</text>
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(11.52 358.41817)">never trained on.</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="245.16" y="314.02291" transform="rotate(-0 245.16 314.02291)">Check every slice</text>
   </g>
   <g id="text_15">
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(230.76 332.144932)">Honest on average can still be dishonest for Email,</text>
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(230.76 344.895313)">or for EDR. Check the groups you’ll act on.</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 600; font-size: 7.2px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="2.88" y="551.979141" transform="rotate(-0 2.88 551.979141)">Next: honest probabilities in hand, how do we turn them into actions?</text>
   </g>

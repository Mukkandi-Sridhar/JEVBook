   <g id="text_7">
    <text style="font-weight: 700; font-size: 7px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="2.88" y="13.451563" transform="rotate(-0 2.88 13.451563)">Three kinds of memory an agent can use</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 600; font-size: 6.2px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="2.88" y="141.373859" transform="rotate(-0 2.88 141.373859)">Every write and every read is a small decision: keep this? fetch that? is it relevant enough to trust?</text>

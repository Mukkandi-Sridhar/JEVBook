   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 7px; font-family: 'Inter'; text-anchor: middle; fill: #1f2430" x="170.28" y="51.618125" transform="rotate(-0 170.28 51.618125)">Reference memory</text>
   </g>
   <g id="text_4">
    <text style="font-size: 5.9px; font-family: 'Inter'; fill: #4b5563" transform="translate(125.590258 87.489935)">documents fetched on demand:</text>
    <text style="font-size: 5.9px; font-family: 'Inter'; fill: #4b5563" transform="translate(124.614914 96.371624)">policies, runbooks, tickets (RAG)</text>

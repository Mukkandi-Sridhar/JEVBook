   <g id="text_2">
    <text style="font-size: 6.1px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="103.68" y="22.513656" transform="rotate(-0 103.68 22.513656)">Code you can run. The QR code in the margin opens the chapter’s lab in Colab.</text>

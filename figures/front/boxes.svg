   </g>
   <g id="text_2">
    <text style="font-size: 6.1px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="103.68" y="18.968937" transform="rotate(-0 103.68 18.968937)">Code you can run. The chapter’s lab notebook has the full version.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 5.6px; font-family: 'Inter'; text-anchor: middle; fill: #ffffff" x="47.88" y="45.234375" transform="rotate(-0 47.88 45.234375)">SET THE THRESHOLD</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6.1px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="103.68" y="44.888937" transform="rotate(-0 103.68 44.888937)">A small decision to make yourself, with costs. The answer follows in brackets.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 5.6px; font-family: 'Inter'; text-anchor: middle; fill: #1f2430" x="47.88" y="71.154375" transform="rotate(-0 47.88 71.154375)">WHERE THIS BREAKS</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.1px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="103.68" y="70.820852" transform="rotate(-0 103.68 70.820852)">The honest limits of what the chapter just showed.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 5.6px; font-family: 'Inter'; text-anchor: middle; fill: #1f2430" x="47.88" y="97.077" transform="rotate(-0 47.88 97.077)">KEY IDEA</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.1px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="103.68" y="96.705109" transform="rotate(-0 103.68 96.705109)">The one sentence to keep if you forget the rest.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 5.6px; font-family: 'Inter'; text-anchor: middle; fill: #1f2430" x="47.88" y="122.997" transform="rotate(-0 47.88 122.997)">GOING DEEPER</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.1px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="103.68" y="122.593656" transform="rotate(-0 103.68 122.593656)">Optional maths. Skip it and nothing later depends on it.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 5.6px; font-family: 'Inter'; text-anchor: middle; fill: #1f2430" x="47.88" y="148.917" transform="rotate(-0 47.88 148.917)">WHY NOT …?</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6.1px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="103.68" y="148.580852" transform="rotate(-0 103.68 148.580852)">A side box that answers the obvious objection in a few lines.</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 5.6px; font-family: 'Inter'; text-anchor: middle; fill: #1f2430" x="47.88" y="174.834375" transform="rotate(-0 47.88 174.834375)">SYNTHETIC</text>
   </g>

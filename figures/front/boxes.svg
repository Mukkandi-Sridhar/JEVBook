   <g id="text_3">
    <text style="font-weight: 700; font-size: 5.6px; font-family: 'Inter'; text-anchor: middle; fill: #1e5e42" x="50.4" y="45.234375" transform="rotate(-0 50.4 45.234375)">KEEP THESE</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6.1px; font-family: 'Inter'; text-anchor: start" x="103.68" y="44.888937" transform="rotate(-0 103.68 44.888937)">At the end of each chapter: that chapter’s key ideas, in one list.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 5.6px; font-family: 'Inter'; text-anchor: middle" x="47.88" y="71.157" transform="rotate(-0 47.88 71.157)">TRY IT</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.1px; font-family: 'Inter'; text-anchor: start" x="103.68" y="70.808937" transform="rotate(-0 103.68 70.808937)">Code you can run. The chapter’s lab notebook has the full version.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 5.6px; font-family: 'Inter'; text-anchor: middle; fill: #ffffff" x="47.88" y="97.074375" transform="rotate(-0 47.88 97.074375)">SET THE THRESHOLD</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.1px; font-family: 'Inter'; text-anchor: start" x="103.68" y="96.728938" transform="rotate(-0 103.68 96.728938)">A small decision to make yourself, with costs. The answer follows in brackets.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 5.6px; font-family: 'Inter'; text-anchor: middle" x="47.88" y="122.994375" transform="rotate(-0 47.88 122.994375)">WHERE THIS BREAKS</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.1px; font-family: 'Inter'; text-anchor: start" x="103.68" y="122.660852" transform="rotate(-0 103.68 122.660852)">The honest limits of what the chapter just showed.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 5.6px; font-family: 'Inter'; text-anchor: middle" x="47.88" y="148.917" transform="rotate(-0 47.88 148.917)">GOING DEEPER</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6.1px; font-family: 'Inter'; text-anchor: start" x="103.68" y="148.513656" transform="rotate(-0 103.68 148.513656)">Optional maths. Skip it and nothing later depends on it.</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 5.6px; font-family: 'Inter'; text-anchor: middle" x="47.88" y="174.837" transform="rotate(-0 47.88 174.837)">WHY NOT …?</text>
   </g>
   <g id="text_14">
    <text style="font-size: 6.1px; font-family: 'Inter'; text-anchor: start" x="103.68" y="174.500852" transform="rotate(-0 103.68 174.500852)">A side box that answers the obvious objection in a few lines.</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 5.6px; font-family: 'Inter'; text-anchor: middle" x="47.88" y="200.754375" transform="rotate(-0 47.88 200.754375)">SYNTHETIC</text>
   </g>
   <g id="text_16">
    <text style="font-size: 6.1px; font-family: 'Inter'; text-anchor: start" x="103.68" y="200.408937" transform="rotate(-0 103.68 200.408937)">Every Jev number comes from a mock model, and says so.</text>

   </g>
   <g id="text_2">
    <text style="font-size: 6.1px; font-family: 'Inter'; text-anchor: start" x="103.68" y="18.945109" transform="rotate(-0 103.68 18.945109)">One sentence worth remembering a year from now. The thick bar marks it.</text>

   <g id="text_1">
    <text style="font-weight: 700; font-size: 6.4px; font-family: 'Inter'; text-anchor: start; fill: #3b9c6e" x="2.88" y="14.84" transform="rotate(-0 2.88 14.84)">CHAPTER 5 · ON ONE PAGE</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="2.88" y="34.19375" transform="rotate(-0 2.88 34.19375)">From probabilities to actions</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="25.92" y="77.86291" transform="rotate(-0 25.92 77.86291)">Two costs make one line</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(11.52 96.14719)">If a false alarm costs C_fa and a miss costs C_miss,</text>
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(11.52 109.487305)">act whenever P is above their ratio.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 7.2px; font-family: 'JetBrains Mono'; text-anchor: start; fill: #1f2430" x="11.52" y="142.927312" transform="rotate(-0 11.52 142.927312)">act when  P &gt; C_fa / (C_fa + C_miss)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.2px; font-family: 'Inter'; text-anchor: start; fill: #4b5563" x="11.52" y="158.260438" transform="rotate(-0 11.52 158.260438)">umbrella 0.2  ·  blocking 0.048  ·  auto-close 0.0016</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="245.16" y="77.86291" transform="rotate(-0 245.16 77.86291)">0.5 is a special case</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(230.76 95.94019)">It only makes sense when both mistakes cost the same.</text>
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(230.76 109.511563)">Here 0.5 cost 2.3× more than the formula’s line.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="25.92" y="195.94291" transform="rotate(-0 25.92 195.94291)">The formula needs honest P</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(11.52 214.02019)">On the calibrated model, theory and practice agree.</text>
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(11.52 226.973798)">On the rebalanced one, the same line cost 62% more.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="245.16" y="195.94291" transform="rotate(-0 245.16 195.94291)">Precision and recall trade</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(230.76 214.202933)">Lower the line: catch more, bother more. The costs</text>
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(230.76 226.77704)">tell you where to stop.</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="25.92" y="314.02291" transform="rotate(-0 25.92 314.02291)">“I don’t know” is an action</text>
   </g>
   <g id="text_14">
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(11.52 332.124448)">Decide only the confident cases and the error rate</text>
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(11.52 344.89154)">drops: 6.1% deciding all, 2.2% deciding the surest</text>
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(11.52 358.176131)">80%.</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="245.16" y="314.02291" transform="rotate(-0 245.16 314.02291)">Three doors</text>
   </g>
   <g id="text_16">
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(230.76 332.10019)">Act, review, escalate: machines at the easy ends,</text>
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(230.76 344.933047)">people in the middle. Chapter 21 runs it for real.</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 6.2px; font-family: 'Inter'; text-anchor: middle; fill: #1f2430" x="254.745" y="386.015371" transform="rotate(-0 254.745 386.015371)">ACT</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 6.2px; font-family: 'Inter'; text-anchor: middle; fill: #ffffff" x="321.903" y="386.015371" transform="rotate(-0 321.903 386.015371)">REVIEW</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 6.2px; font-family: 'Inter'; text-anchor: middle; fill: #ffffff" x="393.858" y="386.015371" transform="rotate(-0 393.858 386.015371)">ESCALATE</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 600; font-size: 7.2px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="2.88" y="551.979141" transform="rotate(-0 2.88 551.979141)">Next, Part II: how do models learn from raw pixels and words?</text>
   </g>

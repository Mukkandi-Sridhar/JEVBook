   <g id="text_1">
    <text style="font-weight: 700; font-size: 7.2px; font-family: 'Inter'; text-anchor: middle; fill: #1f2430" x="45.36" y="23.460187" transform="rotate(-0 45.36 23.460187)">Rules</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="97.92" y="22.782031" transform="rotate(-0 97.92 22.782031)">You write every rule by hand.</text>
   </g>
   <g id="text_3">
    <text style="font-style: italic; font-size: 6.2px; font-family: 'Inter'; text-anchor: start; fill: #4b5563" x="31.68" y="42.184656" transform="rotate(-0 31.68 42.184656)">…but there are too many exceptions</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 7.2px; font-family: 'Inter'; text-anchor: middle; fill: #1f2430" x="45.36" y="62.10675" transform="rotate(-0 45.36 62.10675)">Machine learning</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="97.92" y="62.071797" transform="rotate(-0 97.92 62.071797)">Learn the pattern from labelled examples.</text>
   </g>
   <g id="text_6">
    <text style="font-style: italic; font-size: 6.2px; font-family: 'Inter'; text-anchor: start; fill: #4b5563" x="31.68" y="81.423203" transform="rotate(-0 31.68 81.423203)">…but someone still has to pick the features</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 7.2px; font-family: 'Inter'; text-anchor: middle; fill: #1f2430" x="45.36" y="101.34675" transform="rotate(-0 45.36 101.34675)">Deep learning</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="97.92" y="101.298125" transform="rotate(-0 97.92 101.298125)">Learn the features too, in many layers.</text>
   </g>
   <g id="text_9">
    <text style="font-style: italic; font-size: 6.2px; font-family: 'Inter'; text-anchor: start; fill: #4b5563" x="31.68" y="120.566328" transform="rotate(-0 31.68 120.566328)">…and language turns out to be learnable at scale</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 7.2px; font-family: 'Inter'; text-anchor: middle; fill: #1f2430" x="45.36" y="141.180188" transform="rotate(-0 45.36 141.180188)">LLMs</text>
   </g>
   <g id="text_11">
    <text style="font-size: 7px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="97.92" y="140.474688" transform="rotate(-0 97.92 140.474688)">Read and write language.</text>
   </g>
   <g id="text_12">
    <text style="font-style: italic; font-size: 6.2px; font-family: 'Inter'; text-anchor: start; fill: #4b5563" x="31.68" y="159.830547" transform="rotate(-0 31.68 159.830547)">…but they don’t know your company’s data</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 7.2px; font-family: 'Inter'; text-anchor: middle; fill: #1f2430" x="45.36" y="180.459" transform="rotate(-0 45.36 180.459)">RAG</text>
   </g>
   <g id="text_14">
    <text style="font-size: 7px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="97.92" y="179.750781" transform="rotate(-0 97.92 179.750781)">Look things up in your documents first.</text>
   </g>
   <g id="text_15">
    <text style="font-style: italic; font-size: 6.2px; font-family: 'Inter'; text-anchor: start; fill: #4b5563" x="31.68" y="199.120438" transform="rotate(-0 31.68 199.120438)">…but reading isn’t doing</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 7.2px; font-family: 'Inter'; text-anchor: middle; fill: #1f2430" x="45.36" y="218.922188" transform="rotate(-0 45.36 218.922188)">Agents</text>
   </g>
   <g id="text_17">
    <text style="font-size: 7px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="97.92" y="218.995703" transform="rotate(-0 97.92 218.995703)">Observe, decide, act, in a loop.</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 7px; font-family: 'Inter'; fill: #1f2430" transform="translate(271.28375 151.899233)">System One</text>
    <text style="font-weight: 700; font-size: 7px; font-family: 'Inter'; fill: #1f2430" transform="translate(269.784766 163.180376)">models (Jev)</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 600; font-size: 6.2px; font-family: 'Inter'; text-anchor: middle; fill: #3b9c6e" x="291.96" y="187.273859" transform="rotate(-0 291.96 187.273859)">decide, don’t generate</text>
   </g>
   <g id="text_20">
    <text style="font-size: 6.2px; font-family: 'Inter'; text-anchor: start; fill: #3b9c6e" x="298.08" y="220.216766" transform="rotate(-0 298.08 220.216766)">the “decide” step</text>
   </g>
  </g>
 </g>

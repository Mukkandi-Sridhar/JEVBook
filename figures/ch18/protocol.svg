  <g id="axes_1">
   <g id="text_1">
    <text style="font-weight: 700; font-size: 7px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="25.92" y="21.982969" transform="rotate(-0 25.92 21.982969)">Collect labels</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.1px; font-family: 'Inter'; fill: #4b5563" transform="translate(143.28 16.927146)">a few hundred to a few thousand</text>
    <text style="font-size: 6.1px; font-family: 'Inter'; fill: #4b5563" transform="translate(143.28 26.490683)">recent cases with known outcomes</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 7px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="25.92" y="53.092578" transform="rotate(-0 25.92 53.092578)">Plot, don’t just score</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6.1px; font-family: 'Inter'; fill: #4b5563" transform="translate(143.28 47.956161)">reliability diagram + ECE with a range;</text>
    <text style="font-size: 6.1px; font-family: 'Inter'; fill: #4b5563" transform="translate(143.28 57.502065)">look near your thresholds</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 7px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="25.92" y="85.449062" transform="rotate(-0 25.92 85.449062)">Slice</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.1px; font-family: 'Inter'; fill: #4b5563" transform="translate(143.28 79.405505)">every group you act on</text>
    <text style="font-size: 6.1px; font-family: 'Inter'; fill: #4b5563" transform="translate(143.28 89.262604)">differently: source, customer, language</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 7px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="25.92" y="117.166797" transform="rotate(-0 25.92 117.166797)">Fix</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.1px; font-family: 'Inter'; fill: #4b5563" transform="translate(143.28 111.371442)">base-rate adjustment if you know it;</text>
    <text style="font-size: 6.1px; font-family: 'Inter'; fill: #4b5563" transform="translate(143.28 120.873979)">Platt or temperature on labels</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 7px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="25.92" y="148.668516" transform="rotate(-0 25.92 148.668516)">Re-test</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.1px; font-family: 'Inter'; fill: #4b5563" transform="translate(143.28 143.051442)">on a schedule, and after any model</text>
    <text style="font-size: 6.1px; font-family: 'Inter'; fill: #4b5563" transform="translate(143.28 152.591151)">version or data change</text>
   </g>

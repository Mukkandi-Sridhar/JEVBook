   <g id="text_1">
    <text style="font-weight: 700; font-size: 6.4px; font-family: 'Inter'; text-anchor: start; fill: #3b9c6e" x="2.88" y="14.84" transform="rotate(-0 2.88 14.84)">CHAPTER 18 · ON ONE PAGE</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="2.88" y="34.19375" transform="rotate(-0 2.88 34.19375)">Testing Jev’s calibration yourself</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="25.92" y="77.86291" transform="rotate(-0 25.92 77.86291)">Both claims can be true</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(11.52 96.122933)">A model can be calibrated where it was checked, and</text>
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(11.52 109.508329)">miscalibrated on data that differs. Calibration</text>
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(11.52 121.488389)">belongs to model and data together.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="245.16" y="77.86291" transform="rotate(-0 245.16 77.86291)">Same model, two companies</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(230.76 96.154198)">ECE 0.013 at Kestrel (7.6% attacks), 0.036 at Harbor</text>
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(230.76 108.780055)">(3.5%). Harbor’s risks come out about twice too high.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="25.92" y="192.34291" transform="rotate(-0 25.92 192.34291)">Fix the base rate first</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(11.52 210.447683)">Adjusting the odds for Harbor’s base rate cut ECE to</text>
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(11.52 223.21154)">0.010; Platt scaling on 300 labels to 0.007.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="245.16" y="192.34291" transform="rotate(-0 245.16 192.34291)">Small samples lie</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(230.76 210.602933)">With 100 labels, a model whose true ECE is 0.013</text>
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(230.76 223.191055)">typically measures about 0.043. Report a range, and</text>
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(230.76 235.968389)">get more labels.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="25.92" y="306.82291" transform="rotate(-0 25.92 306.82291)">Check choices too</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(11.52 324.962182)">For a choice: does the top label’s confidence match</text>
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(11.52 337.715798)">how often it’s right? Then check each label.</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="245.16" y="306.82291" transform="rotate(-0 245.16 306.82291)">Scores until proven otherwise</text>
   </g>
   <g id="text_14">
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(230.76 324.923909)">Treat new model outputs as scores. Once tested and</text>
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(230.76 337.695313)">fixed on your data, treat them as probabilities.</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 600; font-size: 7.2px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="2.88" y="551.979141" transform="rotate(-0 2.88 551.979141)">Next: what happens to an industry when a decision becomes almost free.</text>
   </g>

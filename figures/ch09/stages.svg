   </g>
   <g id="text_2">
    <text style="font-size: 6px; font-family: 'Inter'; fill: #4b5563" transform="translate(23.071875 82.680879)">predict the next word</text>
    <text style="font-size: 6px; font-family: 'Inter'; fill: #4b5563" transform="translate(23.408438 92.114355)">on a huge pile of text</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 600; font-size: 6.2px; font-family: 'Inter'; fill: #1f2430" transform="translate(35.316469 133.271596)">knows a lot;</text>
    <text style="font-weight: 600; font-size: 6.2px; font-family: 'Inter'; fill: #1f2430" transform="translate(25.643984 143.078615)">just continues text</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 7px; font-family: 'Inter'; text-anchor: middle; fill: #1f2430" x="168.48" y="53.771563" transform="rotate(-0 168.48 53.771563)">Instruction tuning</text>
   </g>
   <g id="text_5">
    <text style="font-size: 6px; font-family: 'Inter'; fill: #4b5563" transform="translate(135.756563 82.711816)">learn from examples of</text>
    <text style="font-size: 6px; font-family: 'Inter'; fill: #4b5563" transform="translate(148.458281 92.011699)">good answers</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 600; font-size: 6.2px; font-family: 'Inter'; fill: #1f2430" transform="translate(157.692969 133.922596)">follows</text>

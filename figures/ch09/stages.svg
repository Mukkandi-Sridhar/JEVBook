   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 7px; font-family: 'Inter'; text-anchor: middle; fill: #1f2430" x="283.68" y="53.771563" transform="rotate(-0 283.68 53.771563)">Preference tuning</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6px; font-family: 'Inter'; fill: #4b5563" transform="translate(245.916094 82.67666)">learn from people’s ratings</text>
    <text style="font-size: 6px; font-family: 'Inter'; fill: #4b5563" transform="translate(254.975156 92.521699)">(RLHF and relatives)</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 600; font-size: 6.2px; font-family: 'Inter'; fill: #b8323a" transform="translate(262.219766 133.32633)">helpful, polite;</text>

   <g id="text_1">
    <text style="font-weight: 700; font-size: 6.6px; font-family: 'Inter'; text-anchor: start; fill: #4b5563" x="2.88" y="29.76075" transform="rotate(-0 2.88 29.76075)">1865 · COAL</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 500; font-size: 6.2px; font-family: 'Inter'" transform="translate(12.319516 56.380193)">Watt’s engine gets</text>
    <text style="font-weight: 500; font-size: 6.2px; font-family: 'Inter'" transform="translate(16.04775 66.406453)">more work from</text>
    <text style="font-weight: 500; font-size: 6.2px; font-family: 'Inter'" transform="translate(15.810406 75.780744)">each ton of coal</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 500; font-size: 6.2px; font-family: 'Inter'" transform="translate(105.861141 61.001948)">work done by</text>
    <text style="font-weight: 500; font-size: 6.2px; font-family: 'Inter'" transform="translate(99.472719 70.354927)">coal gets cheaper</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 500; font-size: 6.2px; font-family: 'Inter'" transform="translate(185.853344 56.380193)">engines spread to</text>
    <text style="font-weight: 500; font-size: 6.2px; font-family: 'Inter'" transform="translate(194.068828 65.864437)">mills, mines,</text>
    <text style="font-weight: 500; font-size: 6.2px; font-family: 'Inter'" transform="translate(190.524172 75.158807)">railways, ships</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 600; font-size: 6.2px; font-family: 'Inter'" transform="translate(279.621656 57.030709)">Britain burns</text>
    <text style="font-weight: 600; font-size: 6.2px; font-family: 'Inter'" transform="translate(283.040375 65.755453)">more coal,</text>
    <text style="font-weight: 600; font-size: 6.2px; font-family: 'Inter'" transform="translate(287.08975 75.677572)">not less</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 6.6px; font-family: 'Inter'; text-anchor: start; fill: #3b9c6e" x="2.88" y="116.157656" transform="rotate(-0 2.88 116.157656)">NOW · DECISIONS</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 500; font-size: 6.2px; font-family: 'Inter'" transform="translate(14.540375 143.320271)">a model answers</text>
    <text style="font-weight: 500; font-size: 6.2px; font-family: 'Inter'" transform="translate(21.756594 152.193719)">in one pass,</text>
    <text style="font-weight: 500; font-size: 6.2px; font-family: 'Inter'" transform="translate(12.195516 161.467744)">not token by token</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 500; font-size: 6.2px; font-family: 'Inter'" transform="translate(105.412125 143.411334)">each decision</text>
    <text style="font-weight: 500; font-size: 6.2px; font-family: 'Inter'" transform="translate(109.122438 152.181609)">costs a tiny</text>
    <text style="font-weight: 500; font-size: 6.2px; font-family: 'Inter'" transform="translate(100.697703 162.180744)">fraction of a cent</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 500; font-size: 6.2px; font-family: 'Inter'" transform="translate(186.161406 142.804412)">decisions nobody</text>
    <text style="font-weight: 500; font-size: 6.2px; font-family: 'Inter'" transform="translate(194.515906 152.803547)">could afford</text>
    <text style="font-weight: 500; font-size: 6.2px; font-family: 'Inter'" transform="translate(198.526531 161.443525)">get made</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 600; font-size: 6.2px; font-family: 'Inter'" transform="translate(271.016734 143.430709)">far more decisions</text>
    <text style="font-weight: 600; font-size: 6.2px; font-family: 'Inter'" transform="translate(281.340219 152.262984)">in total, and</text>
    <text style="font-weight: 600; font-size: 6.2px; font-family: 'Inter'" transform="translate(271.161563 162.18365)">new uses for them</text>
   </g>
  </g>
 </g>

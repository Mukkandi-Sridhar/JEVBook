   <g id="text_1">
    <text style="font-weight: 700; font-size: 6.6px; font-family: 'Inter'; text-anchor: start; fill: #3b9c6e" x="10.08" y="35.52075" transform="rotate(-0 10.08 35.52075)">A GOOD FIT</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 6.6px; font-family: 'Inter'; text-anchor: start; fill: #b8323a" x="184.32" y="34.916953" transform="rotate(-0 184.32 34.916953)">A POOR FIT, OR PEOPLE DECIDE</text>
   </g>
   <g id="text_3">
    <text style="font-size: 6.1px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="10.08" y="58.537484" transform="rotate(-0 10.08 58.537484)">• many similar cases a day</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6.1px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="184.32" y="58.545109" transform="rotate(-0 184.32 58.545109)">• one-off judgements with no precedent</text>
   </g>
   <g id="text_5">
    <text style="font-size: 6.1px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="10.08" y="80.764641" transform="rotate(-0 10.08 80.764641)">• a fixed set of answers</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.1px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="184.32" y="80.733187" transform="rotate(-0 184.32 80.733187)">• answers that must be written</text>
   </g>
   <g id="text_7">
    <text style="font-size: 6.1px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="10.08" y="101.768937" transform="rotate(-0 10.08 101.768937)">• outcomes you can learn from</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.1px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="184.32" y="102.333187" transform="rotate(-0 184.32 102.333187)">• rare cases with no labels</text>
   </g>
   <g id="text_9">
    <text style="font-size: 6.1px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="10.08" y="123.337484" transform="rotate(-0 10.08 123.337484)">• a cost you can put on a mistake</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.1px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="184.32" y="123.337484" transform="rotate(-0 184.32 123.337484)">• decisions nobody may take without a named person</text>
   </g>
   <g id="text_11">
    <text style="font-size: 6.1px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="10.08" y="144.937484" transform="rotate(-0 10.08 144.937484)">• time or money pressure per case</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6.1px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="184.32" y="144.949398" transform="rotate(-0 184.32 144.949398)">• problems that need a plan, not a verdict</text>
   </g>
  </g>
 </g>

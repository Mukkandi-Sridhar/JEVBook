   <g id="text_1">
    <text style="font-weight: 700; font-size: 6.4px; font-family: 'Inter'; text-anchor: start; fill: #3b9c6e" x="2.88" y="14.84" transform="rotate(-0 2.88 14.84)">CHAPTER 26 · ON ONE PAGE</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="2.88" y="34.19375" transform="rotate(-0 2.88 34.19375)">An applications gallery</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="25.92" y="77.86291" transform="rotate(-0 25.92 77.86291)">Same arithmetic, different lines</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(11.52 95.984933)">The cost of a miss against a false alarm sets the</text>
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(11.52 108.773048)">line: about 5% for support tickets, 0.3% for clinical</text>
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(11.52 122.25817)">intake.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="245.16" y="77.86291" transform="rotate(-0 245.16 77.86291)">Volume decides who decides</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(230.76 95.964448)">Millions of cheap decisions a day: the model decides</text>
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(230.76 108.735313)">and people audit. A few costly ones: people decide.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="25.92" y="195.94291" transform="rotate(-0 25.92 195.94291)">Every choice needs a way out</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(11.52 214.064932)">Other, none, not enough information: each domain</text>
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(11.52 226.853048)">needs the option that catches what fits nowhere.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="245.16" y="195.94291" transform="rotate(-0 245.16 195.94291)">Measure before you trust</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(230.76 214.02019)">On synthetic support tickets the mock routed 74%</text>
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(230.76 226.791055)">correctly and barely ranked urgency. Without labels,</text>
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(230.76 239.575397)">you’d never have known.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="25.92" y="314.02291" transform="rotate(-0 25.92 314.02291)">Route only when sure</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(11.52 332.124448)">Routing only confident tickets: 55% of them, 85%</text>
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(11.52 344.89154)">right. The rest go to a person.</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="245.16" y="314.02291" transform="rotate(-0 245.16 314.02291)">High stakes: order, don’t decide</text>
   </g>
   <g id="text_14">
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(230.76 332.116901)">Where a person must make the call, the model’s job is</text>
    <text style="font-size: 6.9px; font-family: 'Source Serif 4'; fill: #4b5563" transform="translate(230.76 344.933048)">the queue: who is seen first, and what to look at.</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 600; font-size: 7.2px; font-family: 'Inter'; text-anchor: start; fill: #1f2430" x="2.88" y="551.979141" transform="rotate(-0 2.88 551.979141)">Next: build a small System One model of your own.</text>
   </g>

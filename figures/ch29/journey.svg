   <g id="text_1">
    <text style="font-size: 6.6px; font-family: 'Inter'; text-anchor: start" x="31.68" y="19.086234" transform="rotate(-0 31.68 19.086234)">We learned to speak in probabilities, make them calibrated and turn them into actions.</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.6px; font-family: 'Inter'; text-anchor: start" x="31.68" y="46.407562" transform="rotate(-0 31.68 46.407562)">Networks learned patterns, LLMs learned to write, and agents to act.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 6.6px; font-family: 'Inter'; text-anchor: start" x="31.68" y="73.840266" transform="rotate(-0 31.68 73.840266)">A new kind of model decided in one pass, with probabilities we could test.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6.6px; font-family: 'Inter'; text-anchor: start" x="31.68" y="101.200266" transform="rotate(-0 31.68 101.200266)">We compared methods, set thresholds from costs and named the patterns.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 6.6px; font-family: 'Inter'; text-anchor: start" x="31.68" y="128.487562" transform="rotate(-0 31.68 128.487562)">We built it: calls, an agent, a case study, our own model, a service.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.6px; font-family: 'Inter'; text-anchor: start" x="31.68" y="155.886234" transform="rotate(-0 31.68 155.886234)">Now decisions are cheap. The question is which ones deserve them.</text>
   </g>
